[workspace]
members = [
  "apps/desktop",
  "crates/agentmeter-collectors",
  "crates/agentmeter-core",
  "crates/agentmeter-pricing",
  "crates/agentmeter-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"
