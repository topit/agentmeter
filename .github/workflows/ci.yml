name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-checks:
    name: Portable checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Type checking
        run: cargo check --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  macos-native:
    name: macOS production build and visual matrix
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Verify the Metal Toolchain is available
        run: xcrun metal --version
      - name: Workspace checks with production features
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the desktop app
        run: cargo build -p agentmeter-desktop
      - name: Capture the locale and theme matrix
        run: |
          set -euo pipefail
          mkdir -p screenshots
          BIN="target/debug/agentmeter-desktop"
          PREFS_DB="$HOME/Library/Application Support/AgentMeter/agentmeter.db"

          # Pre-grant screen capture so a TCC prompt cannot cover the windows.
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access
             (service, client, client_type, auth_value, auth_reason, auth_version,
              indirect_object_identifier_type, indirect_object_identifier, flags, last_modified)
             VALUES
             ('kTCCServiceScreenCapture','/bin/bash',1,2,0,1,0,'UNUSED',0,datetime('now')),
             ('kTCCServiceScreenCapture','/usr/local/bin/bash',1,2,0,1,0,'UNUSED',0,datetime('now')),
             ('kTCCServiceScreenCapture','com.apple.screencapture',0,2,0,1,0,'UNUSED',0,datetime('now'))" || true

          # One launch creates the full schema so preferences can be seeded
          # through the app's own table.
          "$BIN" & FIRST_PID=$!
          sleep 8
          kill "$FIRST_PID" 2>/dev/null || true
          wait "$FIRST_PID" 2>/dev/null || true
          sleep 1

          # The locale and theme matrix drives the app's own persisted
          # preferences, which also exercises startup preference loading.
          capture() {
            local name="$1" pref_lang="$2" lang="$3" appearance="$4" route="$5"
            local seeded_activity=0
            local seeded_sessions=0
            sqlite3 "$PREFS_DB" "INSERT OR REPLACE INTO preferences (key, value_json)
             VALUES ('app_preferences', '{\"language\":\"$pref_lang\",\"appearance\":\"$appearance\"}')"
            if [[ "$route" == "activity" ]]; then
              seeded_activity=1
              sqlite3 "$PREFS_DB" <<'SQL'
          INSERT INTO source_installations
            (id, adapter_id, platform, root_path, discovery_method, enabled, permission_state)
          VALUES
            ('ui-activity-installation', 'synthetic', 'macos', '/fixture/activity', 'ci', 1, 'granted');
          INSERT INTO source_objects
            (id, installation_id, native_path, kind, parser_version)
          VALUES
            ('ui-activity-source', 'ui-activity-installation', '/fixture/activity/events.jsonl', 'fixture', 1);
          INSERT INTO usage_events
            (source_object_id, event_id, occurred_at_unix_ms, client, provider, model,
             input_tokens, output_tokens, cache_read_tokens, cache_write_tokens,
             reasoning_tokens, confidence)
          VALUES
            ('ui-activity-source', 'event-1', 1704585600000, 'amp', 'anthropic', 'claude-sonnet-4-6', 12000, 3000, 8000, 0, 1000, 'exact'),
            ('ui-activity-source', 'event-2', 1704585601000, 'codex-desktop', 'openai', 'gpt-5.3-codex', 9000, 2500, 4000, 0, 500, 'exact'),
            ('ui-activity-source', 'event-3', 1704672000000, 'amp', 'openai', 'unknown-model', 6000, 1200, 0, 0, 300, 'derived');
          INSERT INTO event_costs
            (source_object_id, event_id, kind, usd, confidence)
          VALUES
            ('ui-activity-source', 'event-1', 'api_equivalent_estimate', 0.12, 'estimated'),
            ('ui-activity-source', 'event-2', 'api_equivalent_estimate', 0.08, 'estimated'),
            ('ui-activity-source', 'event-3', 'unpriced', NULL, 'estimated');
          SQL
            fi
            if [[ "$route" == "sessions" ]]; then
              seeded_sessions=1
              sqlite3 "$PREFS_DB" <<'SQL'
          INSERT INTO source_installations
            (id, adapter_id, platform, root_path, discovery_method, enabled, permission_state)
          VALUES
            ('ui-sessions-installation', 'synthetic', 'macos', '/fixture/sessions', 'ci', 1, 'granted');
          INSERT INTO source_objects
            (id, installation_id, native_path, kind, parser_version)
          VALUES
            ('ui-sessions-source', 'ui-sessions-installation', '/fixture/sessions/events.jsonl', 'jsonl', 3);
          INSERT INTO sessions
            (source_object_id, session_id, client, project, started_at_unix_ms, ended_at_unix_ms)
          VALUES
            ('ui-sessions-source', 'session-fixture-1', 'amp', 'agentmeter', 1787011200000, 1787013900000),
            ('ui-sessions-source', 'session-fixture-2', 'codex-desktop', NULL, 1786924800000, 1786925400000);
          INSERT INTO usage_events
            (source_object_id, event_id, session_id, occurred_at_unix_ms, client, provider, model,
             input_tokens, output_tokens, cache_read_tokens, cache_write_tokens,
             reasoning_tokens, confidence)
          VALUES
            ('ui-sessions-source', 'session-event-1', 'session-fixture-1', 1787011200000, 'amp', 'anthropic', 'claude-sonnet-4-6', 18000, 4200, 9000, 0, 1200, 'exact'),
            ('ui-sessions-source', 'session-event-2', 'session-fixture-1', 1787013900000, 'amp', 'openai', 'gpt-5.3-codex', 8000, 1700, 3000, 0, 500, 'derived'),
            ('ui-sessions-source', 'session-event-3', 'session-fixture-2', 1786925400000, 'codex-desktop', 'openai', 'unknown-model', 5000, 900, 0, 0, 100, 'estimated');
          INSERT INTO event_costs
            (source_object_id, event_id, kind, usd, confidence)
          VALUES
            ('ui-sessions-source', 'session-event-1', 'provider_reported', 0.09, 'exact'),
            ('ui-sessions-source', 'session-event-1', 'api_equivalent_estimate', 0.11, 'estimated'),
            ('ui-sessions-source', 'session-event-2', 'api_equivalent_estimate', 0.07, 'estimated'),
            ('ui-sessions-source', 'session-event-3', 'unpriced', NULL, 'estimated');
          SQL
            fi
            LANG="$lang" AGENTMETER_INITIAL_ROUTE="$route" "$BIN" &
            local pid=$!
            sleep 8
            screencapture -x "screenshots/${name}.png"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [[ "$seeded_activity" == 1 ]]; then
              sqlite3 "$PREFS_DB" "PRAGMA foreign_keys = ON;
               DELETE FROM source_installations WHERE id = 'ui-activity-installation'"
            fi
            if [[ "$seeded_sessions" == 1 ]]; then
              sqlite3 "$PREFS_DB" "PRAGMA foreign_keys = ON;
               DELETE FROM source_installations WHERE id = 'ui-sessions-installation'"
            fi
            sleep 1
          }

          for route in overview activity sessions sources settings; do
            capture "${route}-en-light" en "en_US.UTF-8" light "$route"
          done
          capture "overview-zh-light" zh-cn "zh_CN.UTF-8" light overview
          capture "activity-zh-light" zh-cn "zh_CN.UTF-8" light activity
          capture "sessions-zh-light" zh-cn "zh_CN.UTF-8" light sessions
          capture "sources-zh-light" zh-cn "zh_CN.UTF-8" light sources
          capture "settings-zh-light" zh-cn "zh_CN.UTF-8" light settings

          for route in overview activity sessions sources settings; do
            capture "${route}-en-dark" en "en_US.UTF-8" dark "$route"
          done
          capture "overview-zh-dark" zh-cn "zh_CN.UTF-8" dark overview
          capture "activity-zh-dark" zh-cn "zh_CN.UTF-8" dark activity
          capture "sessions-zh-dark" zh-cn "zh_CN.UTF-8" dark sessions
          capture "sources-zh-dark" zh-cn "zh_CN.UTF-8" dark sources
          capture "settings-zh-dark" zh-cn "zh_CN.UTF-8" dark settings
      - name: Upload the visual matrix
        uses: actions/upload-artifact@v4
        with:
          name: ui-matrix-${{ github.sha }}
          path: screenshots/
